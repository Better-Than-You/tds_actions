name: CI Caching Exercise

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Dependencies
        id: cache-python
        uses: actions/cache@v4
        with:
          # Using a universal path for the runner
          path: ~/.cache/pip
          key: cache-a11cdd0

      - name: prime-cache-a11cdd0
        id: prime-cache-a11cdd0
        # This run command is required to "echo" the hit/miss result
        run: echo "cache-hit=${{ steps.cache-python.outputs.cache-hit }}"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
