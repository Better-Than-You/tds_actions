name: CI Caching Exercise

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Dependencies
        id: cache-python
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: cache-a11cdd0

      - name: prime-cache-a11cdd0
        id: prime-cache-a11cdd0
        run: |
          echo "Cache hit result: ${{ steps.cache-python.outputs.cache-hit }}"
          if [ "${{ steps.cache-python.outputs.cache-hit }}" == "true" ]; then
            echo "Cache restored."
          else
            echo "Cache miss."
          fi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
